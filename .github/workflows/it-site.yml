name: Macrodyne Inside

# Deploys the internal home page (it-site/) to its own Azure Static Web App.
# Scoped to it-site/** so it does not run on Requisition App commits.
#
# The other workflow in this folder deploys the PUBLIC orange-bay app from the
# repository root and carries a guard step that removes it-site/ before upload.
# If that guard is ever removed, the company noticeboard goes on the open
# internet. See it-site/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'it-site/**'
      - '.github/workflows/it-site.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'it-site/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_IT_SITE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Everything served to the browser
          app_location: 'it-site/site'
          # The /api/bulletin function
          api_location: 'it-site/api'
          # No build step - the pages are self-contained HTML
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_IT_SITE }}
          action: close
